version: '3.8'

services:
  bot:
    build: .
    command: python -m src.app.run_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  admin:
    build: .
    command: python -m src.app.run_admin
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
