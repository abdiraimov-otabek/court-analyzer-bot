[project]
name = "test-bot"
version = "0.1.0"
description = "MVP Telegram bot for KAD analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4.1",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.22",
  "openpyxl>=3.1.5",
  "uvicorn>=0.27.0",
  "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
